<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO -->
    <title>
      Trazoo Global | Corporate Gifting, Custom Merchandise & Pan-India Fulfilment
    </title>

    <meta
      name="description"
      content="End-to-end corporate gifting, custom merchandise, event and festive gifting for enterprises and institutions. Trazoo handles sourcing, branding, packaging, Pan-India fulfilment and shipment visibility through one team."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow"
    />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://trazooglobal.com/"
    />

    <!-- LCP Hero Image Preload -->
    <link
      rel="preload"
      as="image"
      href="/hero-lcp/curated-kits-640.webp"
      imagesrcset="
        /hero-lcp/curated-kits-320.webp 320w,
        /hero-lcp/curated-kits-480.webp 480w,
        /hero-lcp/curated-kits-640.webp 640w
      "
      imagesizes="(max-width: 640px) 180px, (max-width: 768px) 220px, 260px"
      type="image/webp"
      fetchpriority="high"
    />

    <!-- Open Graph -->
    <meta
      property="og:site_name"
      content="Trazoo Global"
    />

    <meta
      property="og:title"
      content="Trazoo Global | Corporate Gifting, Custom Merchandise & Pan-India Fulfilment"
    />

    <meta
      property="og:description"
      content="End-to-end corporate gifting, custom merchandise, event and festive gifting for enterprises and institutions."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://trazooglobal.com/"
    />

    <meta
      property="og:image"
      content="https://trazooglobal.com/preview-v2.png"
    />

    <meta
      property="og:image:secure_url"
      content="https://trazooglobal.com/preview-v2.png"
    />

    <meta
      property="og:image:type"
      content="image/png"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Trazoo Global | Corporate Gifting, Custom Merchandise & Pan-India Fulfilment"
    />

    <meta
      name="twitter:description"
      content="End-to-end corporate gifting, custom merchandise, event and festive gifting for enterprises and institutions."
    />

    <meta
      name="twitter:image"
      content="https://trazooglobal.com/preview-v2.png"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      href="/logo.jpeg"
    />

    <!-- Organization Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Trazoo Global",
        "url": "https://trazooglobal.com",
        "logo": "https://trazooglobal.com/logo.jpeg",
        "description": "End-to-end corporate gifting, custom merchandise, and Pan-India fulfilment solutions",
        "foundingDate": "2020",
        "sameAs": [
          "https://www.linkedin.com/company/trazoo-global"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
